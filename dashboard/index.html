<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书馆数据看板（案例复现）</title>
  <link href="https://cdn.staticfile.org/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">图书馆数据看板</h1>
    <p class="text-muted" id="sub-title">数据来源：课程统一数据集</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各月借阅量（ECharts柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">借阅趋势（Chart.js折线图）</h2>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
    </div>
  </section>

  <script src="https://cdn.staticfile.org/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.staticfile.org/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js"></script>
  <script src="https://cdn.staticfile.org/chart.js/4.4.1/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
